
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GK26 QR Check-In</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f7f3ec;
      color: #1d2b4f;
      text-align: center;
      margin: 0;
      padding: 22px 16px;
    }

    h1 { margin: 14px 0 8px; font-size: 27px; }
    .subtitle { color: #666; margin-bottom: 22px; }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      overflow: hidden;
    }

    #status {
      max-width: 450px;
      margin: 20px auto;
      padding: 22px 14px;
      border-radius: 14px;
      background: #eee;
      color: #333;
      font-size: 19px;
      font-weight: bold;
      white-space: pre-line;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .valid { background: #d9f7df !important; color: #176b2c !important; }
    .used { background: #ffe0e0 !important; color: #a40000 !important; }
    .invalid { background: #fff0c7 !important; color: #8a5a00 !important; }

    button {
      display: inline-block;
      margin: 8px 4px;
      padding: 14px 22px;
      border: none;
      border-radius: 10px;
      background: #1d2b4f;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; }
    .seat-total { font-size: 23px; }
  </style>
</head>

<body>
  <h1>🎟️ GK26 CHECK-IN</h1>
  <div class="subtitle">Annual Concert &amp; Graduation Day 2026</div>

  <div id="reader"></div>

  <div id="status">READY TO SCAN</div>

  <button id="startButton" onclick="startScanner()">OPEN CAMERA</button>
  <button id="nextButton" onclick="scanNext()" hidden>SCAN NEXT TICKET</button>

<script>
  const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzxLe33xjDmxhwSutOzHxDudaUQV6Bwkh5KAGA_QeeEGiFw5iX00c5LvC3zDwSls90/exec";

  let scanner = null;
  let busy = false;
  let starting = false;

  const statusBox = document.getElementById("status");
  const startButton = document.getElementById("startButton");
  const nextButton = document.getElementById("nextButton");

  function showStatus(message, type = "") {
    statusBox.className = type;
    statusBox.textContent = message;
  }

  function loadTicketResult(ticketID) {
    return new Promise((resolve, reject) => {
      const callbackName =
        "gk26Callback_" + Date.now() + "_" +
        Math.floor(Math.random() * 100000);

      const script = document.createElement("script");
      let finished = false;

      const timeout = setTimeout(() => {
        cleanup();
        reject(new Error("Request timed out. Check internet and Apps Script deployment."));
      }, 20000);

      function cleanup() {
        if (finished) return;
        finished = true;
        clearTimeout(timeout);
        delete window[callbackName];
        script.remove();
      }

      window[callbackName] = function(result) {
        cleanup();
        resolve(result);
      };

      script.onerror = function() {
        cleanup();
        reject(new Error("Could not connect to the ticket database."));
      };

      script.src =
        SCRIPT_URL +
        "?action=checkTicket" +
        "&ticketID=" + encodeURIComponent(ticketID) +
        "&callback=" + encodeURIComponent(callbackName) +
        "&_=" + Date.now();

      document.body.appendChild(script);
    });
  }

  async function startScanner() {
    if (starting || scanner || busy) return;

    starting = true;
    startButton.disabled = true;
    showStatus("OPENING CAMERA...");

    try {
      scanner = new Html5Qrcode("reader");

      await scanner.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: { width: 240, height: 240 },
          aspectRatio: 1
        },
        onScanSuccess,
        () => {}
      );

      startButton.hidden = true;
      showStatus("CAMERA ACTIVE — POINT AT QR CODE");
    } catch (error) {
      scanner = null;
      showStatus(
        "CAMERA ERROR\n\n" + (error.message || String(error)) +
        "\n\nAllow camera access in your browser settings.",
        "invalid"
      );
      startButton.disabled = false;
    } finally {
      starting = false;
    }
  }

  async function onScanSuccess(decodedText) {
    if (busy) return;
    busy = true;

    showStatus("CHECKING TICKET...\n" + decodedText);

    try {
      if (scanner) {
        await scanner.pause(true);
      }
    } catch (e) {}

    try {
      const result = await loadTicketResult(decodedText.trim());

      if (result.status === "VALID") {
        showStatus(
          "✅ VALID TICKET\n\n" +
          "Ticket ID: " + result.ticketID + "\n" +
          "Student: " + result.studentName + "\n\n" +
          "Free Seats: " + (result.freeSeats ?? 0) + "\n" +
          "Additional Seats: " + (result.addOnSeats ?? 0) + "\n" +
          "TOTAL SEATS: " + (result.seats ?? 0),
          "valid"
        );
      } else if (result.status === "USED") {
        showStatus(
          "⚠️ ALREADY USED\n\n" +
          "Ticket ID: " + (result.ticketID || decodedText) + "\n" +
          "Student: " + (result.studentName || "-"),
          "used"
        );
      } else {
        showStatus(
          "❌ INVALID TICKET\n\n" +
          (result.message || "Ticket not found."),
          "invalid"
        );
      }
    } catch (error) {
      showStatus(
        "⚠️ CONNECTION ERROR\n\n" +
        (error.message || String(error)) +
        "\n\nNo successful result received. Check the deployment before scanning again.",
        "invalid"
      );
    }

    nextButton.hidden = false;
    nextButton.textContent = "SCAN NEXT TICKET";
  }

  async function scanNext() {
    nextButton.hidden = true;
    busy = false;

    if (scanner) {
      try {
        await scanner.resume();
        showStatus("READY TO SCAN");
        return;
      } catch (error) {
        try { await scanner.stop(); } catch (e) {}
        try { scanner.clear(); } catch (e) {}
        scanner = null;
      }
    }

    document.getElementById("reader").innerHTML = "";
    startButton.hidden = false;
    startButton.disabled = false;
    showStatus("READY TO SCAN");
  }
</script>
</body>
</html>
